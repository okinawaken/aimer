<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<base href="${base}/">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>签到签退</title>
<link rel="stylesheet" href="study/css/study.css">
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div class="titles">
      <h1>签到签退</h1>
      <div class="desc">预约签到、换座，或按套餐结账签退</div>
    </div>
    <div class="actions">
      <button class="btn" id="btnRefresh">刷新</button>
      <button class="btn primary" id="btnSignIn">签到</button>
      <button class="btn" id="btnChange">换座</button>
      <button class="btn danger" id="btnSignOut">签退</button>
    </div>
  </div>
  <div class="card">
    <div class="bd pad">
      <div class="venue-bar" id="venueBar">
        <span class="venue-cap" id="kVenueCap">当前门店</span>
        <span class="venue-name" id="kVenue">—</span>
        <span class="spacer"></span>
        <select id="venueSelect" class="venue-select" hidden aria-label="选择门店"></select>
      </div>
      <div class="loc-warn" id="locWarn" hidden>
        <span id="locWarnText">未获取到门店坐标</span>
        <span class="spacer"></span>
        <button class="btn sm" id="btnRetryLoc">重试</button>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="k">在座状态</div><div class="v" id="kSeat">—</div></div>
        <div class="kpi"><div class="k">当前签到ID</div><div class="v" id="kSignId">—</div></div>
        <div class="kpi"><div class="k">累计签到次数</div><div class="v" id="kSignNum">—</div></div>
        <div class="kpi"><div class="k">累计学习天数</div><div class="v" id="kDays">—</div></div>
      </div>
      <div id="seatInfo" style="margin-top:14px"></div>
      <div id="nextReserve" style="margin-top:10px"></div>
      <div id="lightBox" style="margin-top:12px"></div>
      <div class="tips" id="tips" hidden></div>
    </div>
  </div>
</div>

<!-- 签到/换座/签退向导 -->
<div class="modal-mask" id="wizMask">
  <div class="modal wizard" role="dialog" aria-modal="true" aria-labelledby="wizTitle">
    <div class="wiz-head">
      <h3 id="wizTitle">签到</h3>
      <div id="wizStepper" class="wiz-steps"></div>
      <div class="spacer"></div>
      <button class="btn ghost sm" id="btnWizClose" aria-label="关闭">✕</button>
    </div>
    <div class="wiz-body" id="wizBody"></div>
    <div class="wiz-foot" id="wizFoot"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script src="study/js/study-token-guard.js"></script>
<script>
const TOKEN = (() => {
  try { if (parent && parent.getAppToken) { const t = parent.getAppToken(); if (t && t.token) return t.token; } } catch (e) {}
  return new URLSearchParams(location.search).get('_token') || '';
})();
const BASE = document.baseURI;
function toast(msg, ok = true){const b=document.getElementById('toast');const el=document.createElement('div');el.className='toast'+(ok?'':' err');el.textContent=msg;b.appendChild(el);setTimeout(()=>el.remove(),2600);}
async function api(path,{method='GET',query,body}={}){
  const url=new URL('erupt-api/study/'+String(path).replace(/^\//,''),BASE);
  if(query)for(const[k,v]of Object.entries(query)){if(v!==''&&v!==null&&v!==undefined)url.searchParams.set(k,v);}
  const headers={token:TOKEN};const init={method,headers};
  if(body!==undefined){headers['Content-Type']='application/json';init.body=JSON.stringify(body);}
  const res=await fetch(url,init);
  if(res.status===401){try{parent.location.reload();}catch(e){location.reload();}throw new Error('登录已失效');}
  if(res.status===403)throw new Error('无权限：请为该菜单授权');
  const json=await res.json().catch(()=>null);
  if(res.status>=500)throw new Error((json&&(json.message||json.error))||('服务异常 '+res.status));
  if(json&&json.success===false)throw new Error(json.message||'操作失败');
  return json?json.data:null;
}
const $=(s,r=document)=>r.querySelector(s);
const dash=v=>(v===0||v===null||v===undefined||v==='')?'—':v;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// 按钮忙碌态：返回还原函数
function setBusy(btn, text){
  if(!btn || btn.dataset.busy === '1') return ()=>{};
  btn.dataset.busy = '1';
  btn.dataset.text = btn.textContent;
  if(text) btn.textContent = text;
  btn.disabled = true;
  return ()=>{ btn.dataset.busy=''; btn.textContent=btn.dataset.text; btn.disabled=false; };
}
function duration(h, m){
  if((h===null||h===undefined)&&(m===null||m===undefined)) return '—';
  return `${h||0}h${m||0}m`;
}

let state = {
  userSignId: null,
  packageId: null,
  packageName: '',
  venueId: null,
  venueName: '',
  venueLng: null,
  venueLat: null,
  qrCodeNeedSignOut: null,
  hasSeat: false,
  nextReserve: null,
  // 可选门店列表（未在座时可下拉选择），元素含 id/venueName/venueLng/venueLat
  venueOptions: [],
  // 用户在未在座状态下手动指定的门店；下次加载时优先使用
  pinnedVenueId: null
};

function showLocWarn(msg){ $('#locWarnText').textContent = msg || '未获取到门店坐标'; $('#locWarn').hidden = false; }
function hideLocWarn(){ $('#locWarn').hidden = true; }

// 门店坐标缓存（key=venueId），门店配置在会话内不变，取到即复用
const venueLocCache = new Map();
async function getVenueLocation(venueId){
  if(venueId==null) return null;
  if(venueLocCache.has(venueId)) return venueLocCache.get(venueId);
  const v = await api('venue/reserve/detail',{query:{venueId}});
  const loc = (v && v.venueLng!=null && v.venueLat!=null) ? {lng:v.venueLng, lat:v.venueLat, name:v.venueName} : null;
  if(loc) venueLocCache.set(venueId, loc);
  return loc;
}

// 签到/签退/换座确认所需经纬度：直接取当前需签到门店的坐标，不再请求浏览器定位
function resolveSignLocation(){
  if(state.venueLng!=null && state.venueLat!=null){
    return Promise.resolve({lng:state.venueLng, lat:state.venueLat});
  }
  const c = state.venueId!=null ? venueLocCache.get(state.venueId) : null;
  return Promise.resolve(c ? {lng:c.lng, lat:c.lat} : null);
}

// sign/index 的入参坐标须为门店坐标；在座时用签到门店自身的坐标，优先于列表首项
function venueCoordsOf(v){
  if(!v) return null;
  return (v.venueLng!=null && v.venueLat!=null) ? {lng:v.venueLng, lat:v.venueLat} : null;
}

// 门店对象（含坐标）写入坐标缓存
function cacheVenueList(list){
  (list||[]).forEach(v=>{
    const c = venueCoordsOf(v);
    if(c && v.id!=null) venueLocCache.set(v.id, {lng:c.lng, lat:c.lat, name:v.venueName});
  });
}
// 合并门店列表（按 id 去重，保留顺序），只保留可选项需要的字段
function mergeVenues(base, add){
  const out = (base||[]).slice();
  (add||[]).forEach(v=>{
    if(!v || v.id==null) return;
    const item = {id:v.id, venueName:v.venueName, venueLng:v.venueLng, venueLat:v.venueLat};
    const i = out.findIndex(x=>x && x.id===item.id);
    if(i>=0) out[i] = Object.assign({}, out[i], item);
    else out.push(item);
  });
  return out;
}
// 渲染门店下拉：仅未在座且门店数 >1 时可切换
function renderVenueSelect(currentId, selectable){
  const sel = $('#venueSelect');
  const opts = state.venueOptions || [];
  if(!selectable || opts.length<2){ sel.hidden = true; sel.innerHTML=''; return; }
  sel.innerHTML = opts.map(v=>`<option value="${esc(v.id)}"${v.id===currentId?' selected':''}>${esc(dash(v.venueName||v.id))}</option>`).join('');
  sel.hidden = false;
}

async function loadIndex(){
  const restore = setBusy($('#btnRefresh'), '刷新中…');
  try{
    // 用户已指定门店时优先用它，否则回退本地缓存
    const wantId = state.pinnedVenueId!=null ? state.pinnedVenueId : state.venueId;
    let loc = venueCoordsOf(wantId!=null ? venueLocCache.get(wantId) : null);
    let venueId = loc ? wantId : null;
    if(!loc){
      // 无可用坐标：sign/index 必传坐标，先取门店列表作引导
      try{
        const sel = await api('venue/reserve/select');
        const list = (sel && sel.venueList) || [];
        if(list.length){
          cacheVenueList(list);
          state.venueOptions = mergeVenues(state.venueOptions, list);
          const v = (wantId!=null && list.find(x=>x && x.id===wantId)) || list[0];
          if(v && v.id!=null){ venueId = v.id; loc = await getVenueLocation(venueId); }
        }
      }catch(e){ loc = null; }
    }
    if(!loc || loc.lng==null || loc.lat==null){
      showLocWarn('未获取到门店坐标，请检查门店是否已配置经纬度');
      toast('未获取到门店坐标，请检查门店配置', false);
      return;
    }
    hideLocWarn();
    const d=await api('sign/index',{query:{currentLng:loc.lng,currentLat:loc.lat,venueId}});
    if(!d){toast('未获取到签到信息',false);return;}
    const hasSeat = Number(d.hasSeat)===1;
    state.hasSeat = hasSeat;
    $('#kSeat').textContent = hasSeat ? '在座' : '未在座';
    $('#kSignNum').textContent = dash(d.userSignInfoNum);
    $('#kDays').textContent = dash(d.studyDays);
    state.userSignId = d.userSignId || (d.userSignInfoList && d.userSignInfoList[0] && d.userSignInfoList[0].id) || null;
    $('#kSignId').textContent = dash(state.userSignId);
    const pkg = d.signInUserPackage;
    // 签到传参用 signInUserPackageId（与原小程序 settlementData.id 一致），id 仅作兜底
    state.packageId = (pkg && pkg.signInUserPackageId) || (pkg && pkg.id) || null;
    state.packageName = (pkg && pkg.packageName) || '';
    // 扫码签退开关（字符串 "true"/"false"），签退时按此分流
    state.qrCodeNeedSignOut = d.qrCodeNeedSignOut;
    // 门店信息：在座取座位所在门店；未在座取用户指定门店，未指定则取最近门店
    const nearList = (d.venueNearestList && d.venueNearestList.length) ? d.venueNearestList : [];
    // 响应里的门店对象即带坐标，写入缓存后刷新无需再查门店列表/详情
    cacheVenueList(nearList);
    if(d.venueNearest) cacheVenueList([d.venueNearest]);
    state.venueOptions = mergeVenues(state.venueOptions, nearList.concat(d.venueNearest?[d.venueNearest]:[]));
    const seatVenueId = (d.seatCurrent && d.seatCurrent.venueId) || (d.userSign && d.userSign.venueId) || null;
    const signVenue = (d.userSign && d.userSign.venue) || null;
    let picked = null;
    if(hasSeat && seatVenueId!=null){
      picked = nearList.find(v=>v && v.id===seatVenueId) || signVenue || null;
    }
    if(!picked && state.pinnedVenueId!=null){
      // 未在座时尊重用户的下拉选择
      picked = nearList.find(v=>v && v.id===state.pinnedVenueId)
            || state.venueOptions.find(v=>v && v.id===state.pinnedVenueId)
            || null;
    }
    if(!picked) picked = nearList[0] || d.venueNearest || null;
    state.venueId = (picked && picked.id) || seatVenueId || (signVenue && signVenue.id) || venueId || null;
    // 坐标优先取响应内的门店对象，避免额外请求详情
    const pLoc = venueCoordsOf(picked);
    state.venueName = (picked && picked.venueName) || (signVenue && signVenue.venueName) || '';
    if(pLoc){ state.venueLng = pLoc.lng; state.venueLat = pLoc.lat; }
    else {
      const vLoc = state.venueId!=null ? await getVenueLocation(state.venueId).catch(()=>null) : null;
      state.venueLng = vLoc ? vLoc.lng : null;
      state.venueLat = vLoc ? vLoc.lat : null;
      if(!state.venueName) state.venueName = (vLoc && vLoc.name) || '';
    }
    state.nextReserve = d.nextReserveInfo || null;
    // 标题区分：在座显示当前门店，未在座表示即将签到的门店
    $('#kVenueCap').textContent = hasSeat ? '当前门店' : '待签到门店';
    $('#kVenue').textContent = dash(state.venueName || state.venueId);
    // 未在座时可切换门店；在座时门店由座位决定，不提供切换
    renderVenueSelect(state.venueId, !hasSeat);

    // 在座列表
    const list = d.userSignInfoList && d.userSignInfoList.length ? d.userSignInfoList : (d.userSign ? [d.userSign] : []);
    $('#seatInfo').innerHTML = list.length ? list.map(s=>{
      const si=s.seatInfo||{};
      const extra=[s.signOutExpectTimeStr?`预计签退 ${esc(s.signOutExpectTimeStr)}`:'',s.packageName?esc(s.packageName):''].filter(Boolean).join(' · ');
      return `<div class="list-row"><div><span class="tag ok">${esc(dash(si.areaName))} · ${esc(dash(si.seatNumber))}</span></div>
        <div class="muted">签到 ${esc(dash(si.signInTimeStr||s.signInTimeStr))} · 已学 ${duration(si.studyHours,si.studyMinutes)}${extra?` · ${extra}`:''}</div></div>`;
    }).join('') : '<div class="muted">当前未在座</div>';

    // 下一笔预约（签到走的就是这条预约路径）
    if(d.nextReserveInfo){
      $('#nextReserve').innerHTML = `<div class="list-row"><div>下一笔预约：${esc(dash(d.nextReserveInfo.reserveDesc))}</div>
        <div class="muted">${esc(dash(d.nextReserveInfo.reserveDateStr))} ${esc(dash(d.nextReserveInfo.reserveTimeStr))}</div></div>`;
    } else { $('#nextReserve').innerHTML = ''; }

    // 按钮可用性
    const btnChange=$('#btnChange'), btnSignOut=$('#btnSignOut');
    btnChange.disabled = !(Number(d.canChangeSeat)===1 && state.userSignId);
    btnChange.title = btnChange.disabled ? (d.descNoChangeSeat||'') : '';
    btnSignOut.disabled = !(hasSeat && state.userSignId);
    btnSignOut.title = btnSignOut.disabled ? (d.descNoSignOut||'') : '';
    $('#btnSignIn').textContent = d.buttonTextOfSignIn || '签到';
    btnChange.textContent = d.buttonTextOfChangeSeat || '换座';
    btnSignOut.textContent = d.buttonTextOfSignOut || '签退';

    // 状态提示
    const tip = !hasSeat ? d.descNoSignIn : (d.descNoSignOut || (d.configStudyIndexText || ''));
    $('#tips').textContent = tip || '';
    $('#tips').hidden = !tip;

    // 灯控
    const seat=d.seatCurrent;
    if(seat && seat.id && Number(seat.lightBindStatus)!==0){ renderLight(seat); }
    else { $('#lightBox').innerHTML=''; }
  }catch(e){toast('状态加载失败：'+e.message,false);}
  finally{ restore(); }
}

function renderLight(seat){
  $('#lightBox').innerHTML = `<div class="list-row"><div>座位灯控${seat.seatNumber?` <span class="muted">· ${esc(seat.seatNumber)}</span>`:''}</div>
    <div><button class="btn sm" data-light="turnOn" data-seat="${esc(seat.id)}">开灯</button>
    <button class="btn sm" data-light="turnOff" data-seat="${esc(seat.id)}">关灯</button></div></div>`;
}

async function turnLight(seatId, flag, btn){
  const restore = setBusy(btn, '…');
  try{ await api('sign/esp-light/turn',{method:'POST',body:{seatId:Number(seatId),turnFlag:flag}}); toast(flag==='turnOn'?'已开灯':'已关灯'); }
  catch(e){ toast('操作失败：'+e.message,false); }
  finally{ restore(); }
}

/* ========================= 向导：签到 / 换座 / 签退 ========================= */

const WIZ_DEFS = {
  sign:    { title:'签到',   steps:[{key:'confirm',label:'确认'},{key:'done',label:'完成'}] },
  change:  { title:'换座',   steps:[{key:'seat',label:'选座'},{key:'confirm',label:'确认'},{key:'done',label:'完成'}] },
  signout: { title:'签退',   steps:[{key:'confirm',label:'确认'},{key:'done',label:'完成'}] }
};

let WIZ = null;

function closeWizard(){
  if(WIZ && WIZ.submitting) return;
  $('#wizMask').classList.remove('show');
  WIZ = null;
}

function openWizard(flow){
  if(flow==='change' && !state.userSignId) return toast('未获取到当前签到ID',false);
  if(flow==='signout' && !state.userSignId) return toast('未获取到当前签到ID',false);
  WIZ = { flow, step:0, submitting:false, data:{ selected:null, result:null } };
  WIZ.steps = WIZ_DEFS[flow].steps;
  $('#wizTitle').textContent = WIZ_DEFS[flow].title;
  renderWiz();
  $('#wizMask').classList.add('show');
  if(flow==='change') loadChangeSeats();
}

function renderWiz(){
  renderStepper();
  const step = WIZ.steps[WIZ.step];
  const body = $('#wizBody'), foot = $('#wizFoot');
  foot.innerHTML = '';
  if(WIZ.flow==='sign'){
    if(step.key==='confirm') renderSignConfirm(body, foot);
    else renderDone(body, foot);
  } else if(WIZ.flow==='change'){
    if(step.key==='seat') renderChangeSeatStep(body, foot);
    else if(step.key==='confirm') renderChangeConfirm(body, foot);
    else renderDone(body, foot);
  } else if(WIZ.flow==='signout'){
    if(step.key==='confirm') renderSignOutConfirm(body, foot);
    else renderDone(body, foot);
  }
}

function renderStepper(){
  const parts = WIZ.steps.map((s,i)=>{
    const cls = i<WIZ.step?'done': i===WIZ.step?'active':'';
    return `<span class="s ${cls}">${esc(s.label)}</span>`;
  });
  $('#wizStepper').innerHTML = parts.join('<span class="sep">/</span>');
}

function footPrev(label='上一步'){
  return `<button class="btn" id="btnWizPrev">${esc(label)}</button>`;
}
function wirePrev(){ $('#btnWizPrev').addEventListener('click', ()=>{ if(WIZ.submitting)return; WIZ.step=Math.max(0,WIZ.step-1); renderWiz(); }); }

/* ---- 签到：确认（走待签到预约路径，空 qrCode 调 seat/list） ---- */
function renderSignConfirm(body, foot){
  const nr = state.nextReserve;
  if(!nr){
    // 无待签到预约：签到只走已预约路径，此时无可签对象，不暴露必然失败的确认按钮
    $('#wizStepper').innerHTML = ''; // 空状态无流程，隐藏步骤面包屑
    body.innerHTML = `
      <div class="wiz-empty">
        <div class="t">没有待签到预约</div>
        <div class="d">签到只针对已预约的座位。请先在「预约」里完成预约，到达时段后再来签到。</div>
      </div>`;
    foot.innerHTML = `<div class="spacer"></div><button class="btn primary" id="btnWizFinish">关闭</button>`;
    $('#btnWizFinish').addEventListener('click', closeWizard);
    return;
  }
  body.innerHTML = `
    <div class="wiz-hero"><div class="cap">待签到预约</div><div class="val">${esc(dash(nr.reserveDateStr))} ${esc(dash(nr.reserveTimeStr))}</div></div>
    <div class="wiz-confirm">
      <div class="list-row"><div>门店</div><div>${esc(state.venueName||state.venueId||'—')}</div></div>
      <div class="list-row"><div>扣费套餐</div><div>${esc(state.packageName||state.packageId||'—')}</div></div>
    </div>
    <div class="hint block">确认后对预约自动入座，无需扫码选座。</div>`;
  foot.innerHTML = `<div class="spacer"></div><button class="btn" id="btnWizCancel">取消</button><button class="btn primary" id="btnWizSignDo">确认签到</button>`;
  $('#btnWizCancel').addEventListener('click', closeWizard);
  $('#btnWizSignDo').addEventListener('click', doSignConfirm);
}

async function doSignConfirm(){
  if(WIZ.submitting) return;
  if(!state.packageId) return toast('未获取到扣费套餐，无法签到',false);
  WIZ.submitting=true;
  const restore = setBusy($('#btnWizSignDo'), '签到中…');
  try{
    // 待签到预约路径：空 qrCode，上游对预约自动入座（SV0001 / signInFlag=1）
    const body = { qrCode:'', signAnotherFlag:0 };
    if(state.venueId) body.venueId = state.venueId;
    if(state.packageId) body.signInUserPackageId = Number(state.packageId);
    const map = await api('sign/seat/list',{method:'POST',body});
    if(map===1 || (map && Number(map.signInFlag)===1)){
      const nr = state.nextReserve;
      WIZ.data.result = { ok:true, title:'签到成功', rows: nr ? [['签到预约', `${dash(nr.reserveDateStr)} ${dash(nr.reserveTimeStr)}`]] : [] };
    } else {
      WIZ.data.result = { ok:false, title:'未能签到', sub:'当前无待签到预约，或上游返回了选座图（非预约签到路径）' };
    }
    WIZ.step = WIZ.steps.findIndex(s=>s.key==='done');
    renderWiz();
    if(WIZ.data.result.ok) await loadIndex();
  }catch(e){
    WIZ.data.result = { ok:false, title:'签到失败', sub:e.message };
    WIZ.step = WIZ.steps.findIndex(s=>s.key==='done');
    renderWiz();
  }finally{
    WIZ.submitting=false;
    restore();
  }
}

/* ---- 换座：选座 ---- */
async function loadChangeSeats(){
  if(WIZ.submitting) return;
  WIZ.submitting=true;
  $('#wizBody').innerHTML = '<div class="loading">加载座位图</div>';
  try{
    const map = await api('sign/change/seat/list',{method:'POST',body:{userSignId:Number(state.userSignId)}});
    WIZ.data.seatMap = map;
    if(WIZ.flow==='change' && WIZ.steps[WIZ.step].key==='seat') renderWiz();
  }catch(e){
    $('#wizBody').innerHTML = `<div class="empty-box">加载失败：${esc(e.message)}<br><button class="btn sm" data-retry="1" style="margin-top:10px">重试</button></div>`;
  }finally{
    WIZ.submitting=false;
  }
}

function renderChangeSeatStep(body, foot){
  const map = WIZ.data.seatMap;
  if(!map){
    body.innerHTML = '<div class="loading">加载座位图</div>';
    foot.innerHTML = `<div class="spacer"></div><button class="btn" id="btnWizCancel">取消</button>`;
    $('#btnWizCancel').addEventListener('click', closeWizard);
    return;
  }
  body.innerHTML = `<div id="wizSeatAreas"></div>`;
  renderSeatsInto($('#wizSeatAreas'), map);
  foot.innerHTML = `<div class="sel-info" id="wizSeatSelInfo">未选择座位</div><div class="spacer"></div><button class="btn" id="btnWizCancel">取消</button><button class="btn primary" id="btnWizNext" disabled>下一步</button>`;
  $('#btnWizCancel').addEventListener('click', closeWizard);
  $('#btnWizNext').addEventListener('click', ()=>{ if(WIZ.submitting)return; if(!WIZ.data.selected){toast('请先选择座位',false);return;} WIZ.step++; renderWiz(); });
  syncWizSeatSel();
}

function renderSeatsInto(container, map){
  const areas=(map&&map.venueAreaList)||[];
  let total=0, usable=0;
  const html = areas.map(a=>{
    const seats=a.venueAreaSeatList||[];
    total += seats.length;
    const items=seats.map(s=>{
      const st=Number(s.seatReserveState);
      if(st===10||st===20) usable++;
      const cls=st===10?'s10':st===20?'s20':'s30';
      const disabled=st!==10 && st!==20;
      const times=(s.validTimeStrList||[]).map(v=>v.validTimeStr).filter(Boolean).join('、');
      return `<button type="button" class="seat ${cls}" ${disabled?'disabled':''} data-seat="${esc(s.id)}" data-area="${esc(a.areaName||'')}" data-no="${esc(dash(s.seatNumber))}" title="${esc([s.seatNumber,s.seatReserveDesc].filter(Boolean).join(' · '))}">
        <span class="no">${esc(dash(s.seatNumber))}</span>
        <span class="st">${esc(s.seatReserveDesc||'')}</span>
        ${times?`<span class="tm">${esc(times)}</span>`:''}
      </button>`;
    }).join('');
    return `<div class="area"><div class="area-title">${esc(a.areaName||'区域')}<span class="area-count">${seats.length}</span></div>
      <div class="seats">${items||'<span class="muted">无座位</span>'}</div></div>`;
  }).join('');
  if(!total){
    container.innerHTML = '<div class="empty-box">没有可换的座位</div>';
    return;
  }
  container.innerHTML = `<div class="legend"><span class="lg"><i class="dot free"></i>空闲</span><span class="lg"><i class="dot part"></i>部分时段</span><span class="lg"><i class="dot off"></i>不可预约</span><span class="lg"><i class="dot pick"></i>已选</span><span class="muted">点击座位选中</span></div>` + html;
}

function syncWizSeatSel(){
  const sel = WIZ.data.selected;
  const info = $('#wizSeatSelInfo');
  const next = $('#btnWizNext');
  if(info) info.innerHTML = sel ? `已选：<b>${esc(sel.area)} · ${esc(sel.no)}</b>` : '未选择座位';
  if(next) next.disabled = !sel || WIZ.submitting;
}

function wizSelectSeat(btn){
  if(btn.classList.contains('selected')){ btn.classList.remove('selected'); WIZ.data.selected=null; }
  else {
    $('#wizSeatAreas').querySelectorAll('.seat.selected').forEach(el=>el.classList.remove('selected'));
    btn.classList.add('selected');
    WIZ.data.selected = {id:Number(btn.dataset.seat), area:btn.dataset.area, no:btn.dataset.no};
  }
  syncWizSeatSel();
}

/* ---- 换座：确认 ---- */
function renderChangeConfirm(body, foot){
  const sel = WIZ.data.selected;
  body.innerHTML = `
    <div class="hint" style="margin-bottom:10px">请确认换座信息</div>
    <div class="wiz-confirm">
      <div class="list-row"><div>当前签到ID</div><div><b>${esc(state.userSignId)}</b></div></div>
      <div class="list-row"><div>目标座位</div><div><b>${sel?`${esc(sel.area)} · ${esc(sel.no)}`:'未选择'}</b></div></div>
      <div class="list-row"><div>门店</div><div>${esc(state.venueName||state.venueId||'—')}</div></div>
    </div>`;
  foot.innerHTML = `<div class="spacer"></div>${footPrev()}<button class="btn primary" id="btnWizChangeDo">确认换座</button>`;
  wirePrev();
  $('#btnWizChangeDo').addEventListener('click', doChangeConfirm);
}

async function doChangeConfirm(){
  if(WIZ.submitting) return;
  const sel = WIZ.data.selected;
  if(!sel) return toast('请先选择座位',false);
  WIZ.submitting=true;
  const restore = setBusy($('#btnWizChangeDo'), '提交中…');
  const loc = await resolveSignLocation();
  if(!loc){ WIZ.submitting=false; restore(); return; }
  try{
    await api('sign/change/seat/confirm',{method:'POST',body:{
      seatId:sel.id, userSignId:Number(state.userSignId), currentLng:loc.lng, currentLat:loc.lat
    }});
    WIZ.data.result = { ok:true, title:'换座成功', hero:{ one:`${sel.area} · ${sel.no}`, cap:'已换至' } };
    WIZ.step = WIZ.steps.findIndex(s=>s.key==='done');
    renderWiz();
    await loadIndex();
  }catch(e){
    WIZ.data.result = { ok:false, title:'换座失败', sub:e.message };
    WIZ.step = WIZ.steps.findIndex(s=>s.key==='done');
    renderWiz();
  }finally{
    WIZ.submitting=false;
    restore();
  }
}

/* ---- 签退：确认（/sign/out，按 qrCodeNeedSignOut 分流） ---- */
function renderSignOutConfirm(body, foot){
  const needQr = String(state.qrCodeNeedSignOut)==='true';
  const pkgName = state.packageName||state.packageId;
  body.innerHTML = `
    <div class="hint" style="margin-bottom:10px">确认签退信息，签退后按当前套餐扣费结算</div>
    <div class="wiz-confirm">
      <div class="list-row"><div>当前签到ID</div><div><b>${esc(state.userSignId)}</b></div></div>
      <div class="list-row"><div>结算套餐</div><div>${esc(pkgName)}<span class="muted">（id ${esc(state.packageId)}）</span></div></div>
      <div class="list-row"><div>扫码签退</div><div>${needQr?'<span class="tag err">需座位二维码</span>':'<span class="tag ok">否（直接签退）</span>'}</div></div>
    </div>
    ${needQr?`<div class="field" style="margin-top:14px"><label for="wizSignOutQr">座位二维码内容 <span class="req">*</span></label><input type="text" id="wizSignOutQr" placeholder="座位二维码内容" value="${esc(WIZ.data.qrCode||'')}"><div class="hint block">场馆开启扫码签退（qrCodeNeedSignOut=true），需提供座位二维码</div></div>`:''}`;
  foot.innerHTML = `<div class="spacer"></div><button class="btn" id="btnWizCancel">取消</button><button class="btn danger" id="btnWizSignOutDo">确认签退</button>`;
  $('#btnWizCancel').addEventListener('click', closeWizard);
  $('#btnWizSignOutDo').addEventListener('click', doSignOut);
  if(needQr) setTimeout(()=>$('#wizSignOutQr').focus(),50);
}

async function doSignOut(){
  if(WIZ.submitting) return;
  if(!state.packageId) return toast('未获取到结算套餐，无法签退',false);
  const needQr = String(state.qrCodeNeedSignOut)==='true';
  let qrCode='';
  if(needQr){
    qrCode = ($('#wizSignOutQr').value||'').trim();
    if(!qrCode){ toast('请填写座位二维码内容',false); $('#wizSignOutQr').focus(); return; }
    WIZ.data.qrCode = qrCode;
  }
  WIZ.submitting=true;
  const restore = setBusy($('#btnWizSignOutDo'), '签退中…');
  const loc = await resolveSignLocation();
  if(!loc){ WIZ.submitting=false; restore(); return; }
  try{
    const d = await api('sign/out',{method:'POST',body:{
      qrCode,
      currentLng:loc.lng, currentLat:loc.lat,
      settleUserPackageId:Number(state.packageId),
      userSignId:Number(state.userSignId)
    }});
    // 结算收据：学习时长与扣费作主角数字，其余作明细
    const nums = [];
    if(d && (d.studyHours!=null || d.studyMinutes!=null)) nums.push([duration(d.studyHours, d.studyMinutes), '本次学习时长']);
    if(d && d.payPriceYuan!=null) nums.push([`¥ ${d.payPriceYuan}`, '本次扣费']);
    const rows=[
      d&&d.packageName?['扣费套餐', d.packageName]:null,
      d&&d.settleHourStr?['结算时长', d.settleHourStr]:null,
      d&&d.signOutTimeStr?['签退时间', d.signOutTimeStr]:null,
      d&&d.studyTipText?['提示', d.studyTipText]:null
    ].filter(Boolean);
    WIZ.data.result = { ok:true, title:'签退成功', nums, rows };
    WIZ.step = WIZ.steps.findIndex(s=>s.key==='done');
    renderWiz();
    await loadIndex();
  }catch(e){
    WIZ.data.result = { ok:false, title:'签退失败', sub:e.message };
    WIZ.step = WIZ.steps.findIndex(s=>s.key==='done');
    renderWiz();
  }finally{
    WIZ.submitting=false;
    restore();
  }
}

/* ---- 完成 / 结果步 ---- */
function renderDone(body, foot){
  const r = WIZ.data.result || { ok:false, title:'—' };
  let html = `<div class="wiz-result ${r.ok?'':'err'}"><div class="status">${esc(r.title||(r.ok?'已完成':'操作失败'))}</div>`;
  if(r.ok){
    if(r.hero){
      html += `<div class="nums one"><div><div class="n">${esc(r.hero.one)}</div><div class="c">${esc(r.hero.cap)}</div></div></div>`;
    } else if(r.nums && r.nums.length){
      const cells = r.nums.filter(Boolean).map(([n,c])=>`<div><div class="n">${esc(n)}</div><div class="c">${esc(c)}</div></div>`).join('');
      const cls = r.nums.filter(Boolean).length===1?'one':'';
      html += `<div class="nums ${cls}">${cells}</div>`;
    }
    if(r.rows && r.rows.length){
      html += `<div class="detail">${r.rows.map(([k,v])=>`<div class="list-row"><div class="muted">${esc(k)}</div><div>${esc(v)}</div></div>`).join('')}</div>`;
    }
  } else if(r.sub){
    html += `<div class="hint block" style="margin-top:12px">${esc(r.sub)}</div>`;
  }
  html += `</div>`;
  body.innerHTML = html;
  if(r.ok){
    foot.innerHTML = `<div class="spacer"></div><button class="btn primary" id="btnWizFinish">完成</button>`;
    $('#btnWizFinish').addEventListener('click', closeWizard);
  } else {
    foot.innerHTML = `<div class="spacer"></div>${footPrev('返回重试')}<button class="btn" id="btnWizFinish">关闭</button>`;
    wirePrev();
    $('#btnWizFinish').addEventListener('click', closeWizard);
  }
}

/* ========================= 事件绑定 ========================= */
$('#btnRefresh').addEventListener('click',()=>loadIndex());
// 未在座时切换门店：记住所选门店并重新加载，使其坐标/venueId 生效
$('#venueSelect').addEventListener('change',async e=>{
  const id = Number(e.target.value);
  if(!id) return;
  state.pinnedVenueId = id;
  // 若该门店尚未缓存坐标，先取详情，避免下次请求缺坐标
  if(!venueLocCache.has(id)){
    e.target.disabled = true;
    try{ await getVenueLocation(id); }catch(err){ toast('获取门店信息失败：'+err.message,false); }
    finally{ e.target.disabled = false; }
  }
  loadIndex();
});
// 重试门店坐标：清缓存后整体重载
$('#btnRetryLoc').addEventListener('click',()=>{ venueLocCache.clear(); loadIndex(); });
$('#btnSignIn').addEventListener('click',()=>openWizard('sign'));
$('#btnChange').addEventListener('click',()=>openWizard('change'));
$('#btnSignOut').addEventListener('click',()=>openWizard('signout'));
$('#btnWizClose').addEventListener('click', closeWizard);
$('#wizMask').addEventListener('click', e=>{ if(e.target===e.currentTarget && !(WIZ&&WIZ.submitting)) closeWizard(); });
$('#wizBody').addEventListener('click', e=>{
  if(e.target.closest('[data-retry]')){ loadChangeSeats(); return; }
  const s = e.target.closest('.seat[data-seat]');
  if(s && !s.disabled) wizSelectSeat(s);
});
$('#lightBox').addEventListener('click',e=>{const b=e.target.closest('[data-light]');if(b)turnLight(b.dataset.seat,b.dataset.light,b);});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if($('#wizMask').classList.contains('show')) closeWizard();
});
$('#wizBody').addEventListener('keydown',e=>{
  const id = e.target.id;
  if(e.key==='Enter' && (id==='wizSignOutQr')){ e.preventDefault(); doSignOut(); }
});

StudyTokenGuard.ensure(loadIndex);
</script>
</body>
</html>
